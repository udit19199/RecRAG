# RecRAG Configuration
# All non-sensitive configuration values
#
# Environment variable substitution: ${VAR:-default}

[embedding]
provider = "ollama"
model = "nomic-embed-text"
timeout = 120
# base_url = "http://localhost:11434"  # Uncomment to override Ollama host

[llm]
provider = "ollama"
model = "llama3.2"
timeout = 120
# base_url = "http://localhost:11434"  # Uncomment to override Ollama host

[ingestion]
directory = "data/pdfs"
chunk_size = 1024
chunk_overlap = 50

[vision]
provider = "ollama"
model = "llama3.2-vision"
timeout = 180
# base_url = "http://localhost:11434"  # Uncomment to override Ollama host

[retrieval]
top_k = 4
max_context_tokens = 4096
tokenizer_fallback = "cl100k_base"  # Encoding to use when tiktoken cannot find the model's encoder
context_template = """Context information:
{context}

Question: {question}

Answer:"""

[frontend]
origins = ["http://localhost:3000"]

[storage]
# "lite"   – Milvus Lite: embedded local file, no Docker service required (default).
# "server" – Managed/serverless Milvus (recommended) or optional local Milvus
#             from docker-compose.dev.yml.
deployment = "lite"
collection_prefix = "recrag_"
metric_type = "L2"
# directory is used only for tracking ingestion status
directory = "state"
[storage.server]
# Set MILVUS_HOST env var to override (useful when using cloud or custom host).
# `MILVUS_HOST` may be a hostname (e.g. 'localhost'), a host:port (e.g. 'host:19530'),
# or a full URL (e.g. 'https://in03-...serverless...cloud.zilliz.com').
host = "${MILVUS_HOST:-localhost}"
port = 19530

# Optional credentials for cloud Milvus providers. Set these in your `.env`.
username = "${MILVUS_USERNAME:-}"
password = "${MILVUS_PASSWORD:-}"
