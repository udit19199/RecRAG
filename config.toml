# Non-sensitive settings for local research runs.

[embedding]
model = "text-embedding-3-small"
dimensions = 1536
timeout = 120

[llm]
model = "gpt-6-luna"
reasoning_effort = "medium"
timeout = 120

[cost]
input_price_per_million = 0.10
cached_input_price_per_million = 0.01
cache_write_price_per_million = 0.125
output_price_per_million = 0.50

[graphrag]
namespace = "graphrag"
timeout = 30

[graphrag.graph]
uri = "neo4j://localhost:7687"

[graphrag.retrieval]
timeout = 10

[milvus]
uri = "http://localhost:19530"
timeout = 30
