<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 230" role="img" aria-labelledby="title desc">
  <title id="title">Text to Cypher retrieval</title>
  <desc id="desc">A question and Neo4j schema reach a Text2Cypher retriever. The retriever generates read-only Cypher, Neo4j returns graph records, and the answer model writes the final answer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#228be6"/></marker>
  </defs>
  <rect width="1750" height="230" fill="#ffffff"/>
  <text x="28" y="30" font-family="Comic Sans MS, Segoe Print, cursive" font-size="22" font-weight="700" fill="#1e1e1e">Text to Cypher retrieval</text>
  <g font-family="Comic Sans MS, Segoe Print, cursive" font-size="16" text-anchor="middle">
    <rect x="30" y="76" width="160" height="74" rx="16" fill="#e3fafc" stroke="#15aabf" stroke-width="2"/><text x="110" y="120" fill="#1e1e1e">Question</text>
    <rect x="260" y="76" width="240" height="74" rx="16" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/><text x="380" y="120" fill="#1e1e1e">Text2Cypher retriever</text>
    <rect x="570" y="76" width="210" height="74" rx="16" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/><text x="675" y="120" fill="#1e1e1e">Read-only Cypher</text>
    <rect x="850" y="76" width="180" height="74" rx="16" fill="#ebfbee" stroke="#40c057" stroke-width="2"/><text x="940" y="120" fill="#1e1e1e">Neo4j graph</text>
    <rect x="1090" y="76" width="200" height="74" rx="16" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/><text x="1190" y="120" fill="#1e1e1e">Graph records</text>
    <rect x="1330" y="76" width="190" height="74" rx="16" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/><text x="1425" y="120" fill="#1e1e1e">Answer model</text>
    <ellipse cx="1630" cy="113" rx="90" ry="45" fill="#f3f0ff" stroke="#7950f2" stroke-width="2"/><text x="1630" y="119" fill="#1e1e1e">Final answer</text>
    <rect x="30" y="154" width="180" height="58" rx="16" fill="#ebfbee" stroke="#40c057" stroke-width="2"/><text x="120" y="189" fill="#1e1e1e">Neo4j schema</text>
  </g>
  <g fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round">
    <path d="M190 113 H260"/><path d="M500 113 H570"/><path d="M780 113 H850"/><path d="M1030 113 H1090"/><path d="M1290 113 H1330"/><path d="M1520 113 H1540"/>
  </g>
  <path d="M210 183 H235 V130 H260" fill="none" stroke="#228be6" stroke-width="2" marker-end="url(#blue-arrow)" stroke-linecap="round"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" font-size="13" fill="#1e1e1e" text-anchor="middle">
    <text x="225" y="103">query</text><text x="535" y="103">generate</text><text x="815" y="103">run</text><text x="1060" y="103">matches</text><text x="1310" y="103">context</text><text x="235" y="148" fill="#228be6">schema</text>
  </g>
</svg>
