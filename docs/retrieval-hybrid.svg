<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 315" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid retrieval</title>
  <desc id="desc">The query reaches both the vector and full-text indexes. Their results merge, receive graph context, and reach the answer model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#228be6"/></marker>
  </defs>
  <rect width="1900" height="315" fill="#ffffff"/>
  <text x="28" y="30" font-family="Comic Sans MS, Segoe Print, cursive" font-size="22" font-weight="700" fill="#1e1e1e">Hybrid retrieval</text>
  <g font-family="Comic Sans MS, Segoe Print, cursive" font-size="16" text-anchor="middle">
    <rect x="30" y="126" width="160" height="74" rx="16" fill="#e3fafc" stroke="#15aabf" stroke-width="2"/><text x="110" y="170">Question</text>
    <rect x="260" y="126" width="230" height="74" rx="16" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/><text x="375" y="170">Embed and extract terms</text>
    <rect x="560" y="64" width="240" height="74" rx="16" fill="#ebfbee" stroke="#40c057" stroke-width="2"/><text x="680" y="108">chunk_embeddings</text>
    <rect x="560" y="188" width="240" height="74" rx="16" fill="#ebfbee" stroke="#40c057" stroke-width="2"/><text x="680" y="232">chunk_fulltext</text>
    <rect x="880" y="126" width="190" height="74" rx="16" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/><text x="975" y="170">Merge results</text>
    <rect x="1150" y="126" width="280" height="74" rx="16" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/><text x="1290" y="162">Entities and 2-hop</text><text x="1290" y="182">paths</text>
    <rect x="1500" y="126" width="190" height="74" rx="16" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/><text x="1595" y="170">Answer model</text>
  </g>
  <ellipse cx="1790" cy="163" rx="80" ry="40" fill="#f3f0ff" stroke="#7950f2" stroke-width="2"/><text x="1790" y="169" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="15">Final answer</text>
  <g fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"><path d="M190 163 H260"/><path d="M490 163 H520 V101 H560"/><path d="M490 163 H520 V225 H560"/><path d="M800 101 H840 V163 H880"/><path d="M800 225 H840 V163 H880"/><path d="M1070 163 H1150"/><path d="M1430 163 H1500"/><path d="M1690 163 H1710"/></g>
  <g font-family="Comic Sans MS, Segoe Print, cursive" font-size="13" fill="#1e1e1e" text-anchor="middle"><text x="225" y="153">query</text><text x="530" y="91" fill="#228be6">meaning</text><text x="530" y="239" fill="#228be6">exact words</text><text x="840" y="91">vector hits</text><text x="840" y="239">text hits</text><text x="1110" y="153">add graph context</text><text x="1465" y="153">context</text></g>
</svg>
