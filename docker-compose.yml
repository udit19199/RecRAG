services:
  # FastAPI service for ingestion (upload PDFs, check status)
  api-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    ports:
      - "8001:8001"
    command: uv run uvicorn app.ingestion.main:app --host 0.0.0.0 --port 8001
    container_name: recrag-api-ingestion
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recrag-network

  # FastAPI service for retrieval (query with RAG)
  api-retrieval:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      - ./state:/app/state
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uv run uvicorn app.retrieval.main:app --host 0.0.0.0 --port 8000
    container_name: recrag-api-retrieval
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recrag-network

  # Next.js frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_RETRIEVAL_API_URL=http://api-retrieval:8000
      - NEXT_PUBLIC_INGESTION_API_URL=http://api-ingestion:8001
    ports:
      - "3000:3000"
    depends_on:
      - api-retrieval
      - api-ingestion
    container_name: recrag-frontend
    networks:
      - recrag-network

  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      target: evaluation
    depends_on:
      api-retrieval:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    command: uv run python jobs/evaluate.py
    container_name: recrag-evaluation
    profiles:
      - eval
    networks:
      - recrag-network

networks:
  recrag-network:
    driver: bridge
