services:
  # FastAPI service for ingestion (upload PDFs, check status)
  api-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    ports:
      - "8001:8001"
    command: uv run uvicorn api.ingestion.main:app --host 0.0.0.0 --port 8001
    container_name: recrag-api-ingestion
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recrag-network

  # FastAPI service for retrieval (query with RAG)
  api-retrieval:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      - ./storage:/app/storage
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uv run uvicorn api.retrieval.main:app --host 0.0.0.0 --port 8000
    container_name: recrag-api-retrieval
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recrag-network

  # Next.js frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_RETRIEVAL_API_URL=http://api-retrieval:8000
      - NEXT_PUBLIC_INGESTION_API_URL=http://api-ingestion:8001
    ports:
      - "3000:3000"
    depends_on:
      - api-retrieval
      - api-ingestion
    container_name: recrag-frontend
    networks:
      - recrag-network

  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      target: evaluation
    depends_on:
      api-retrieval:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    command: uv run python cli/evaluate.py
    container_name: recrag-evaluation
    profiles:
      - eval
    networks:
      - recrag-network

# Milvus Standalone server stack (profile: server)
# These services are included under the top-level `services:` block so
# the compose file only contains one `services:` mapping.
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    profiles: [server]
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - recrag-network

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    profiles: [server]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - recrag-network

  milvus:
    image: milvusdb/milvus:v2.4-latest
    profiles: [server]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - recrag-network

networks:
  recrag-network:
    driver: bridge

volumes:
  # Volumes for the Milvus Standalone server stack (--profile server)
  etcd_data:
  minio_data:
  milvus_data:
