services:
  # ── Infrastructure ────────────────────────────────────────────
  # Single-container Milvus standalone with embedded etcd (no external deps)
  milvus:
    image: milvusdb/milvus:latest
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus_data:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
      - ./user.yaml:/milvus/configs/user.yaml
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    networks:
      - recrag-network

  # ── App Services ──────────────────────────────────────────────
  # FastAPI service for ingestion (upload PDFs, check status)
  api-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    environment:
      - MILVUS_HOST=milvus
      - REC_RAG_API_KEY=${REC_RAG_API_KEY:-}
    ports:
      - "8001:8001"
    command: uv run uvicorn app.ingestion.main:app --host 0.0.0.0 --port 8001 --timeout-graceful-shutdown 30
    container_name: recrag-api-ingestion
    depends_on:
      milvus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recrag-network

  # FastAPI service for retrieval (query with RAG)
  api-retrieval:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      - ./state:/app/state
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    environment:
      - MILVUS_HOST=milvus
      - REC_RAG_API_KEY=${REC_RAG_API_KEY:-}
    ports:
      - "8000:8000"
    command: uv run uvicorn app.retrieval.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 30
    container_name: recrag-api-retrieval
    depends_on:
      milvus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recrag-network

  # Next.js frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_RETRIEVAL_API_URL: http://api-retrieval:8000
        NEXT_PUBLIC_INGESTION_API_URL: http://api-ingestion:8001
    environment:
      - NEXT_PUBLIC_RETRIEVAL_API_URL=http://api-retrieval:8000
      - NEXT_PUBLIC_INGESTION_API_URL=http://api-ingestion:8001
    ports:
      - "3000:3000"
    depends_on:
      - api-retrieval
      - api-ingestion
    container_name: recrag-frontend
    networks:
      - recrag-network

  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      target: evaluation
    depends_on:
      api-retrieval:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./config.toml:/app/config.toml
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    command: uv run python jobs/evaluate.py
    container_name: recrag-evaluation
    profiles:
      - eval
    networks:
      - recrag-network

volumes:
  milvus_data:

networks:
  recrag-network:
    driver: bridge
