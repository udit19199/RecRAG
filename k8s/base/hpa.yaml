apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-ingestion-hpa
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/component: api-ingestion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-ingestion
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
