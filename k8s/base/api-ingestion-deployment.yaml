apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ingestion
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/component: api-ingestion
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api-ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recrag
        app.kubernetes.io/component: api-ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: recrag
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-ingestion
          image: ghcr.io/udit19199/recrag-api:latest
          imagePullPolicy: Always
          command:
            - uv
            - run
            - uvicorn
            - app.ingestion.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
            - --timeout-graceful-shutdown
            - "30"
          ports:
            - containerPort: 8001
              protocol: TCP
              name: http
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recrag-secrets
                  key: openai-api-key
                  optional: true
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recrag-secrets
                  key: nvidia-api-key
                  optional: true
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recrag-secrets
                  key: ollama-api-key
                  optional: true
            - name: MILVUS_HOST
              valueFrom:
                secretKeyRef:
                  name: recrag-secrets
                  key: milvus-host
                  optional: true
            - name: MILVUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: recrag-secrets
                  key: milvus-username
                  optional: true
            - name: MILVUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recrag-secrets
                  key: milvus-password
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: state
              mountPath: /app/state
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: recrag-config
            items:
              - key: config.toml
                path: config.toml
        - name: data
          persistentVolumeClaim:
            claimName: recrag-data
        - name: state
          persistentVolumeClaim:
            claimName: recrag-state
