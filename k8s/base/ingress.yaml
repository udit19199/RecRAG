apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recrag-ingress
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/part-of: recrag
  annotations:
    # ── Required: replace with your ingress controller ─────────────────────────
    # nginx-ingress:
    #   kubernetes.io/ingress.class: "nginx"
    #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
    #
    # GKE:
    #   kubernetes.io/ingress.class: "gce"
    #   kubernetes.io/ingress.global-static-ip-name: "recrag-ip"
    #
    # See docs/KUBERNETES_DEPLOYMENT.md for full options.
    kubernetes.io/ingress.class: "nginx"
spec:
  # tls:
  #   - hosts:
  #       - recrag.example.com
  #       - retrieval.recrag.example.com
  #       - ingestion.recrag.example.com
  #     secretName: recrag-tls
  rules:
    # ── Frontend (main app) ──────────────────────────────────────────────────
    - host: recrag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-frontend
                port:
                  number: 3000
    # ── Retrieval API ──────────────────────────────────────────────────────
    - host: retrieval.recrag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-retrieval
                port:
                  number: 8000
    # ── Ingestion API ──────────────────────────────────────────────────────
    - host: ingestion.recrag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-ingestion
                port:
                  number: 8001
