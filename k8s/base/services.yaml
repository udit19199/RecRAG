apiVersion: v1
kind: Service
metadata:
  name: svc-ingestion
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/component: api-ingestion
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: api-ingestion
---
apiVersion: v1
kind: Service
metadata:
  name: svc-retrieval
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/component: api-retrieval
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: api-retrieval
---
apiVersion: v1
kind: Service
metadata:
  name: svc-frontend
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: frontend
