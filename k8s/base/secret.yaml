#
# Option B: Use Sealed Secrets or External Secrets Operator for GitOps.
#
# Option C: Use the --dry-run=client flag to validate before applying:
#   kubectl create secret generic recrag-secrets ... --dry-run=client -o yaml
#
# The deployment YAMLs reference this Secret by name, so whichever creation
# method you choose, keep the name "recrag-secrets" and the keys below.

apiVersion: v1
kind: Secret
metadata:
  name: recrag-secrets
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/part-of: recrag
type: Opaque
stringData:
  # Replace with real values. Remove keys for providers you don't use.
  rec-rag-api-key: ""
  openai-api-key: ""
  nvidia-api-key: ""
  ollama-api-key: ""
  milvus-host: ""
  milvus-username: ""
  milvus-password: ""
