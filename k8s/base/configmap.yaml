apiVersion: v1
kind: ConfigMap
metadata:
  name: recrag-config
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/part-of: recrag
data:
  config.toml: |
    # RecRAG Configuration
    # Mounted from ConfigMap — overridable per environment via Kustomize patches.

    [embedding]
    provider = "ollama"
    model = "nomic-embed-text:latest"
    base_url = "http://localhost:11434"

    [llm]
    provider = "ollama"
    model = "gpt-oss:20b"
    base_url = "http://localhost:11434"
    api_key = "${OLLAMA_API_KEY}"

    [ingestion]
    directory = "data/pdfs"
    chunk_size = 1024
    chunk_overlap = 50

    [vision]
    provider = "openai"
    model = "gpt-4o-mini"

    [retrieval]
    top_k = 4
    max_context_tokens = 4096
    context_template = """Context information:
    {context}

    Question: {question}

    Answer:"""

    [frontend]
    origins = ["http://localhost:3000"]

    [storage]
    deployment = "server"
    collection_prefix = "recrag_"
    metric_type = "L2"
    directory = "state"
    [storage.server]
    host = "${MILVUS_HOST:-localhost}"
    port = 19530
    username = "${MILVUS_USERNAME:-}"
    password = "${MILVUS_PASSWORD:-}"
