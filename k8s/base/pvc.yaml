apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recrag-data
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/part-of: recrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # StorageClass: uncomment and set to your cluster's default (e.g. "gp3", "standard-rwo", "ebs-sc")
  # storageClassName: gp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recrag-state
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/part-of: recrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: gp3
