apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: recrag
  labels:
    app.kubernetes.io/name: recrag
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recrag
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: recrag
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: ghcr.io/udit19199/recrag-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          env:
            - name: NEXT_PUBLIC_RETRIEVAL_API_URL
              value: "https://retrieval.recrag.example.com"
            - name: NEXT_PUBLIC_INGESTION_API_URL
              value: "https://ingestion.recrag.example.com"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
