apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: recrag

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - services.yaml
  - pvc.yaml
  - ingress.yaml
  - api-ingestion-deployment.yaml
  - api-retrieval-deployment.yaml
  - frontend-deployment.yaml
  - hpa.yaml
  - evaluation-job.yaml

# ── Common labels applied to all resources ────────────────────────────────
commonLabels:
  app.kubernetes.io/managed-by: kustomize

# ── Common annotations ────────────────────────────────────────────────────
commonAnnotations:
  app.kubernetes.io/version: latest

# ── Strategic merge patches ───────────────────────────────────────────────
# Overlays (dev/prod) add environment-specific patches via their own kustomization.
# Global patches (e.g. image tags across all environments) can go here.
images:
  - name: ghcr.io/udit19199/recrag-api
    newTag: latest
  - name: ghcr.io/udit19199/recrag-frontend
    newTag: latest
