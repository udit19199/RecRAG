[project]
name = "recrag"
version = "0.1.0"
description = "Retrieval-Augmented Generation pipeline with Milvus vector storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.14",
    "llama-index-embeddings-nvidia>=0.1.0",
    "llama-index-llms-nvidia>=0.1.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "toml>=0.10.2",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "ragas>=0.1.0",
    "langchain-openai>=0.1.0",
    "datasets>=2.15.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pymilvus>=2.6.9",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "types-requests>=2.32.4.20260107",
    "types-toml>=0.10.8.20240310",
]
