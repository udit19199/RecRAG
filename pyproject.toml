[project]
name = "recrag"
version = "0.1.0"
description = "Graph retrieval research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "langchain>=1.0",
    "langchain-openai>=0.3.26",
    "neo4j-graphrag>=1.19,<2",
    "python-dotenv>=1.2.1",
    "streamlit>=1.63.0",
]

[tool.setuptools]
py-modules = ["dataset", "graphrag_construction", "graphrag_retrieval", "hipporag_retrieval", "rag_retrieval", "raptor_retrieval", "benchmark", "cost"]

[tool.setuptools.packages.find]
where = ["."]
include = ["evals*"]
namespaces = true

[tool.pyright]
include = ["benchmark.py", "hipporag_retrieval.py", "rag_retrieval.py", "raptor_retrieval.py", "cost.py", "dataset.py", "graphrag_construction.py", "graphrag_retrieval.py", "evals"]
extraPaths = ["."]
typeCheckingMode = "basic"
