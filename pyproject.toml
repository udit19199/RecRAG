[project]
name = "recrag"
version = "0.1.0"
description = "Retrieval-Augmented Generation pipeline with Milvus vector storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.14",
    "llama-index-embeddings-nvidia>=0.1.0",
    "llama-index-llms-nvidia>=0.1.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "toml>=0.10.2",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pymilvus[milvus-lite]>=2.6.9",
    "pymupdf>=1.24.0",
    "auth0-fastapi-api>=1.0.0b5",
    "prometheus-client>=0.21.0",
    "anyio>=4.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "PyJWT[crypto]>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"

[project.optional-dependencies]
dev = [
    "llama-parse>=0.5.0",
]
# Research-only extras for the FiNER-139 graph-construction experiment
# (src/experiments/finer139). Kept out of core deps; imported lazily so the
# orchestrator/retrieval services never pull these unless the experiment runs.
# After installing, run: python -m spacy download en_core_web_sm
experiments = [
    "datasets>=3.0.0",
    "spacy>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-requests>=2.32.4.20260107",
    "types-toml>=0.10.8.20240310",
]
